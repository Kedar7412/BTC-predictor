[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Autonomous Polymarket BTC 5-minute Up/Down bot (paper mode by default)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25", "pyyaml>=6", "python-dotenv>=1", "numpy>=1.24"]

[project.optional-dependencies]
live = ["py-clob-client>=0.17"]
backtest = ["matplotlib>=3.7"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
